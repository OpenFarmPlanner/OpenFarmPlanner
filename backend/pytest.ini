[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
# `-n auto --dist loadfile` runs the suite across one worker per core. The tests
# already isolate themselves per database (settings_test uses an in-memory
# SQLite database, which pytest-django gives each worker its own copy of), so
# this is a scheduling change only: 701s -> 233s locally on 4 cores, with the
# same 1164 passing tests and the same combined coverage total.
#
# `loadfile` (not the default `load`) keeps every test in a file on one worker.
# The migration tests in farm/tests/test_migrations_*.py and
# crops/tests/test_migrations_translations.py migrate the schema backwards and
# forwards around each test, so two of them interleaving on one database would
# fight over the schema.
#
# Pass `-n0` to run serially again, which is what `--pdb` and any debugging that
# needs readable interleaved output want.
addopts = --reuse-db --cov=. --cov-report=term-missing -n auto --dist loadfile
