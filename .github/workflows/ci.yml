name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-tests:
    # Split across two runners with `vitest --shard`. Together with the
    # in-process parallelism re-enabled in vite.config.ts this took the
    # frontend gate from one ~9.5 minute job to two ~3 minute ones. Vitest
    # shards by test file, so the two jobs are disjoint and cover the whole
    # suite between them - keep `--shard=N/<count>` in step with the matrix.
    name: frontend-tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (LTS)
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # See e2e.yml for why node_modules is cached wholesale: `npm ci` swings
      # between 20s and 5 minutes on an identical lockfile purely by runner.
      - name: Cache frontend node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd frontend
          echo "Running install command: npm ci"
          npm ci

      - name: Run frontend tests with hard timeout
        run: |
          set -euxo pipefail
          cd frontend
          echo "Running test command (CI, non-watch): npm run test:ci -- --shard=${{ matrix.shard }}/2"
          # Guards against a hung worker (hence the process dump below), not
          # against the suite growing: a green shard takes ~3 minutes of the
          # job's 12, so a cap sitting on the current runtime turns the next
          # added test into a red build. Keep it clear of both the real
          # runtime and the job's timeout-minutes.
          echo "Applying shell hard timeout: 8m"
          echo "Test step start: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --foreground 8m npm run test:ci -- --shard=${{ matrix.shard }}/2
          exit_code=$?
          set -e
          echo "Test step end: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "$exit_code" -eq 124 ]; then
            echo "Frontend tests were terminated by GNU timeout after 8 minutes." >&2
            echo "Active node-related processes at timeout:" >&2
            set +e
            ps -ef | grep -E 'node|vitest|v8' | grep -v grep >&2
            set -e
            exit 124
          fi
          exit "$exit_code"

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDM
        run: python -m pip install --upgrade pip pdm

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Ensure pdm.lock exists
        run: |
          test -f backend/pdm.lock || (echo 'backend/pdm.lock is missing' >&2; exit 1)

      - name: Install backend dependencies with PDM
        run: |
          cd backend
          pdm install -dG test

      - name: Run Django deployment security checks
        env:
          DEBUG: 'False'
          DJANGO_ENV: production
          SECRET_KEY: ci-only-deployment-check-secret-key-not-used-at-runtime
          ALLOWED_HOSTS: openfarmplanner.example
          FRONTEND_URL: https://openfarmplanner.example
          PUBLIC_FRONTEND_URL: https://openfarmplanner.example
        run: |
          cd backend
          pdm run python manage.py check --deploy --fail-level WARNING

      - name: Run backend tests
        run: |
          cd backend
          pdm run compilemessages
          pdm run test

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDM
        run: python -m pip install --upgrade pip pdm

      - name: Install backend dependencies with PDM
        run: |
          cd backend
          pdm install -dG test -dG quality

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --force

      - name: Run quality gate
        # The backend suite is the `backend-tests` job's, not this job's: with
        # it enabled here too, `quality` ran the identical pytest+coverage
        # command a second time and took as long as the job it duplicated.
        env:
          SKIP_BACKEND_TESTS: '1'
        run: make quality

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
