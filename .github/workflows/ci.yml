name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-tests:
    # One job, not a shard matrix. The in-process parallelism re-enabled in
    # vite.config.ts is what took this suite from ~9.5 minutes down; sharding
    # it across two runners then split 4m51s of test work into 2m10s + 2m41s,
    # but `backend-tests` runs 6-7.5 minutes in the same workflow, so the
    # second runner bought nothing on the critical path. Merged back at ~5
    # minutes it still finishes well before the backend job.
    #
    # Re-shard (a `strategy.matrix.shard` plus `--shard=N/<count>`, kept in
    # step with each other) if this suite ever approaches the backend's
    # runtime - there is roughly two minutes of headroom before that.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (LTS)
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # See e2e.yml for why node_modules is cached wholesale: `npm ci` swings
      # between 20s and 5 minutes on an identical lockfile purely by runner.
      - name: Cache frontend node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd frontend
          echo "Running install command: npm ci"
          npm ci

      - name: Run frontend tests with hard timeout
        run: |
          set -euxo pipefail
          cd frontend
          echo "Running test command (CI, non-watch): npm run test:ci"
          # Guards against a hung worker (hence the process dump below), not
          # against the suite growing: a green run takes ~5 minutes of the
          # job's 15, so a cap sitting on the current runtime turns the next
          # added test into a red build. Keep it clear of both the real
          # runtime and the job's timeout-minutes.
          echo "Applying shell hard timeout: 10m"
          echo "Test step start: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --foreground 10m npm run test:ci
          exit_code=$?
          set -e
          echo "Test step end: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "$exit_code" -eq 124 ]; then
            echo "Frontend tests were terminated by GNU timeout after 10 minutes." >&2
            echo "Active node-related processes at timeout:" >&2
            set +e
            ps -ef | grep -E 'node|vitest|v8' | grep -v grep >&2
            set -e
            exit 124
          fi
          exit "$exit_code"

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDM
        run: python -m pip install --upgrade pip pdm

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Ensure pdm.lock exists
        run: |
          test -f backend/pdm.lock || (echo 'backend/pdm.lock is missing' >&2; exit 1)

      - name: Install backend dependencies with PDM
        run: |
          cd backend
          pdm install -dG test

      - name: Run Django deployment security checks
        env:
          DEBUG: 'False'
          DJANGO_ENV: production
          SECRET_KEY: ci-only-deployment-check-secret-key-not-used-at-runtime
          ALLOWED_HOSTS: openfarmplanner.example
          FRONTEND_URL: https://openfarmplanner.example
          PUBLIC_FRONTEND_URL: https://openfarmplanner.example
        run: |
          cd backend
          pdm run python manage.py check --deploy --fail-level WARNING

      - name: Run backend tests
        run: |
          cd backend
          pdm run compilemessages
          pdm run test

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (LTS)
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDM
        run: python -m pip install --upgrade pip pdm

      - name: Install backend dependencies with PDM
        run: |
          cd backend
          pdm install -dG test -dG quality

      # Same wholesale node_modules cache as `frontend-tests` and the two
      # Playwright workflows, and deliberately the same key: this job needs the
      # identical tree, so it can reuse whatever any of them last saved. It was
      # the only frontend consumer left without it, and paid for that in full -
      # measured installs of 4m49s and 5m02s against a 36s quality gate, i.e.
      # the install was 90% of the job.
      - name: Cache frontend node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      # `npm ci`, not the `npm install --force` this step used to run. The
      # --force came in with the workflow's initial import rather than from a
      # resolution failure, and every other job installs this same lockfile
      # with plain `npm ci`. It also matters for the cache above: `npm install`
      # may rewrite package-lock.json, which is what the cache key hashes.
      - name: Install frontend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npm ci

      - name: Run quality gate
        # The backend suite is the `backend-tests` job's, not this job's: with
        # it enabled here too, `quality` ran the identical pytest+coverage
        # command a second time and took as long as the job it duplicated.
        env:
          SKIP_BACKEND_TESTS: '1'
        run: make quality

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
