name: Dependency Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Re-scan unchanged lockfiles after vulnerability databases are updated.
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDM
        run: python -m pip install --upgrade pip pdm

      - name: Ensure pdm.lock exists
        run: |
          test -f backend/pdm.lock || (echo 'backend/pdm.lock is missing' >&2; exit 1)

      - name: Install backend dependencies with PDM
        run: |
          cd backend
          pdm install

      - name: Install pip-audit into the PDM-managed environment
        run: |
          cd backend
          pdm run pip install pip-audit

      # Audits the actual locked/installed backend environment (pdm.lock)
      # rather than a hand-maintained requirements.txt, which this project
      # doesn't use (see CLAUDE.md — backend deps are managed with PDM).
      - name: Run pip-audit
        run: |
          cd backend
          {
            echo "## pip-audit (backend)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +o pipefail
          pdm run pip-audit --desc 2>&1 | tee /tmp/pip-audit.txt
          exit_code=${PIPESTATUS[0]}
          {
            cat /tmp/pip-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$exit_code" -ne 0 ]; then
            echo "::error title=pip-audit found vulnerabilities::Review the pip-audit job summary for affected backend packages and available fix versions."
          fi
          exit "$exit_code"

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    # 10 was not enough once the audit itself started hanging: `npm ci` spent
    # 5m02s of it, one audit call blocked for 5m01s, and the job was cancelled
    # mid-step. The cache below and the per-attempt cap in the audit step both
    # bound that now; this leaves margin for a cold cache on top.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (LTS)
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same wholesale node_modules cache and key as the CI and Playwright
      # workflows. This job was the last one still paying `npm ci` in full -
      # 5m02s of a 10-minute budget, before the audit it exists to run had
      # started.
      - name: Cache frontend node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npm ci

      # --audit-level=high: only fail the build on High/Critical findings,
      # so low/moderate advisories (often unfixable transitive dev-tooling
      # noise) don't block every push/PR.
      #
      # `npm audit` exits 1 both for a real finding and for its own transport
      # errors, so the two have to be told apart by what it printed. Treating
      # every non-zero exit as a finding is what turned pushes to main red on
      # 2026-09-04: registry.npmjs.org answered the advisories endpoint with a
      # 503 and the step reported it as "npm audit found High/Critical
      # vulnerabilities", while `npm ci` in the same job had just said "found 0
      # vulnerabilities". An outage at npm is not a vulnerability in this
      # lockfile, and must not be announced as one.
      - name: Run npm audit
        run: |
          cd frontend
          {
            echo "## npm audit (frontend, --audit-level=high)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +o pipefail
          max_attempts=3
          attempt=1
          endpoint_unreachable=0

          while true; do
            # --fetch-retries=0 so npm does not run its own backoff loop
            # underneath this one (that is multiplicative: a degraded endpoint
            # blocked a single call for 5m01s and the job was cancelled before
            # the second attempt). The outer `timeout` is the hard stop, in
            # case npm ignores or outlives its own deadline.
            timeout 45 npm audit --audit-level=high \
              --fetch-retries=0 --fetch-timeout=20000 2>&1 | tee /tmp/npm-audit.txt
            exit_code=${PIPESTATUS[0]}

            # A clean scan, or a scan that ran and found something: either way
            # the answer is about the lockfile, so stop and report it. 124 is
            # the outer timeout firing, which is a stuck endpoint, not a finding.
            if [ "$exit_code" -eq 0 ]; then
              break
            fi
            if [ "$exit_code" -ne 124 ] \
              && ! grep -qE 'audit endpoint returned an error|npm error code (ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN)' /tmp/npm-audit.txt; then
              break
            fi

            if [ "$exit_code" -eq 124 ]; then
              echo "npm audit did not answer within 45s (attempt ${attempt}/${max_attempts})." | tee -a /tmp/npm-audit.txt
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              endpoint_unreachable=1
              break
            fi

            echo "npm audit could not reach the advisory endpoint (attempt ${attempt}/${max_attempts}); retrying in $((attempt * 10))s."
            sleep "$((attempt * 10))"
            attempt=$((attempt + 1))
          done

          {
            cat /tmp/npm-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Not a clean scan, and deliberately not a red build either: no
          # advisory data came back, so there is nothing to act on and nothing
          # a contributor could fix. The Monday `schedule` re-scans the
          # unchanged lockfile, and the next push re-runs this job anyway.
          if [ "$endpoint_unreachable" -eq 1 ]; then
            echo "::warning title=npm audit could not run::registry.npmjs.org's advisory endpoint was unreachable after ${max_attempts} attempts, so no vulnerability data was retrieved. This is an inconclusive scan, not a clean one."
            exit 0
          fi

          if [ "$exit_code" -ne 0 ]; then
            echo "::error title=npm audit found High/Critical vulnerabilities::Review the npm audit job summary for affected frontend packages and available fix versions."
          fi
          exit "$exit_code"
