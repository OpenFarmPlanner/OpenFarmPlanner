name: Frontend Build

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # See e2e.yml for why node_modules is cached wholesale: `npm ci` swings
      # between 20s and 5 minutes on an identical lockfile purely by runner.
      - name: Cache frontend node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # The frontend's `postbuild` script (build/prerender.ts) launches
      # Playwright's Chrome channel itself, so it must already be installed
      # before `npm run build` runs — see e2e.yml for the same requirement.
      # The retry and apt-lock handling lives in the shared script.
      - name: Install Playwright browser (Chrome)
        timeout-minutes: 15
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
        run: "$GITHUB_WORKSPACE/scripts/ci/install-playwright-chrome.sh"

      - name: Build frontend
        run: npm run build
