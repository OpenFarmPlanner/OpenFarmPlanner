name: Frontend Build

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chrome-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # The frontend's `postbuild` script (build/prerender.ts) launches
      # Playwright's Chrome channel itself, so it must already be installed
      # before `npm run build` runs — see e2e.yml for the same requirement.
      # The retry and apt-lock handling lives in the shared script.
      - name: Install Playwright browser (Chrome)
        timeout-minutes: 15
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
        run: "$GITHUB_WORKSPACE/scripts/ci/install-playwright-chrome.sh"

      - name: Build frontend
        run: npm run build
